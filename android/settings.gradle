// android/settings.gradle

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    // 1. OTIMIZAÇÃO: Esta é a forma moderna e limpa de incluir o plugin do Flutter.
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false

    // As versões dos plugins do Android e Kotlin estão ótimas.
    id "com.android.application" version "8.4.1" apply false
    id "com.android.library" version "8.4.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.22" apply false

    // 2. OTIMIZAÇÃO: Atualizando para uma versão mais recente do plugin do Google Services.
    id "com.google.gms.google-services" version "4.4.1" apply false
}

include ":app"

// O bloco de código antigo para encontrar o SDK do Flutter foi removido
// porque o plugin 'dev.flutter.flutter-gradle-plugin' agora cuida disso.