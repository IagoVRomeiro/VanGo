name: vango
description: "VanGo: Aplicativo para gerenciamento de transporte escolar e universitário."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  firebase_messaging: ^15.0.2

  # Mapas e Geolocalização
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Gerenciamento de Estado
  provider: ^6.1.2

  # Ícones
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/